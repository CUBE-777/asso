[build]
  command = "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: react-router-dom uses client-side routing (BrowserRouter), so
# any direct URL like /members/123 must still serve index.html, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
